<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحديد الطابق</title>

<style>
    body {
        margin: 0;
        padding: 25px 15px;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        text-align: center;
    }

    .card {
        max-width: 450px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    button {
        width: 100%;
        padding: 16px;
        border: 0;
        border-radius: 12px;
        background: #111;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    button:disabled {
        opacity: .5;
    }

    .status {
        margin-top: 20px;
        line-height: 1.8;
    }

    .value {
        font-size: 35px;
        font-weight: bold;
        margin: 8px 0 18px;
    }

    .floor {
        font-size: 65px;
        font-weight: bold;
        margin: 10px;
    }

    .box {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 12px;
        margin-top: 10px;
    }

    .error {
        color: #c62828;
        margin-top: 15px;
    }

    .success {
        color: #16803c;
    }
</style>
</head>

<body>

<div class="card">

    <h1>📍 تحديد الطابق</h1>

    <p>
        اضغط مرة واحدة لقراءة موقعك وضغط الجوال
    </p>

    <button id="startButton" onclick="start()">
        تحديد الطابق
    </button>

    <div id="status" class="status"></div>

    <div id="result" style="display:none;">

        <div class="box">
            ضغط سطح الأرض
            <div id="groundPressure" class="value">--</div>
        </div>

        <div class="box">
            ضغط الجوال
            <div id="phonePressure" class="value">--</div>
        </div>

        <div class="box">
            فرق الضغط
            <div id="pressureDifference" class="value">--</div>
        </div>

        <div class="box">
            الارتفاع عن سطح الأرض
            <div id="height" class="value">--</div>
        </div>

        <hr>

        <div>
            الطابق التقريبي
        </div>

        <div id="floor" class="floor">
            --
        </div>

        <div id="accuracy"></div>

    </div>

    <div id="error" class="error"></div>

</div>


<script>

/* =========================================
   الإعدادات
========================================= */

// متوسط ارتفاع الطابق بالمتر
const FLOOR_HEIGHT = 3.0;

// مدة أخذ قراءات البارومتر
const READING_TIME = 5000;

// عدد القراءات المطلوبة
const REQUIRED_READINGS = 10;


/* =========================================
   المتغيرات
========================================= */

let pressureReadings = [];


/* =========================================
   البداية
========================================= */

async function start() {

    const button = document.getElementById("startButton");

    button.disabled = true;

    document.getElementById("error").innerHTML = "";
    document.getElementById("result").style.display = "none";

    try {

        setStatus("📍 جاري تحديد موقعك...");

        const position = await getGPS();

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;


        setStatus(
            "🌦️ تم تحديد الموقع<br>" +
            "جاري جلب ضغط سطح الأرض..."
        );


        /*
        جلب ضغط سطح الأرض من Open-Meteo
        */

        const weather = await getWeather(
            latitude,
            longitude
        );

        const groundPressure =
            weather.surface_pressure;


        /*
        الآن نحاول قراءة بارومتر الجوال
        */

        setStatus(
            "📱 جاري محاولة قراءة حساس الضغط في الجوال..."
        );


        const phonePressure =
            await readBarometer();


        /*
        حساب الارتفاع
        */

        const altitudeDifference =
            pressureToHeight(
                groundPressure,
                phonePressure
            );


        /*
        حساب الطابق
        */

        const floor =
            Math.max(
                0,
                Math.round(
                    altitudeDifference /
                    FLOOR_HEIGHT
                )
            );


        /*
        عرض النتائج
        */

        document.getElementById("groundPressure").innerHTML =
            groundPressure.toFixed(2) + " hPa";

        document.getElementById("phonePressure").innerHTML =
            phonePressure.toFixed(2) + " hPa";

        document.getElementById("pressureDifference").innerHTML =
            (
                groundPressure - phonePressure
            ).toFixed(2) + " hPa";

        document.getElementById("height").innerHTML =
            altitudeDifference.toFixed(1) + " متر";


        document.getElementById("floor").innerHTML =
            floor === 0
                ? "الأرضي"
                : floor;


        document.getElementById("accuracy").innerHTML =
            "⚠️ النتيجة تقديرية — ارتفاع الطابق مضبوط على " +
            FLOOR_HEIGHT +
            " متر";


        document.getElementById("result").style.display =
            "block";


        setStatus(
            "✅ تم تحديد الطابق"
        );

    }

    catch (error) {

        console.error(error);

        showError(error.message);

    }

    button.disabled = false;
}


/* =========================================
   GPS
========================================= */

function getGPS() {

    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {

            reject(
                new Error(
                    "المتصفح لا يدعم تحديد الموقع."
                )
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(
            resolve,
            () => reject(
                new Error(
                    "يجب السماح للموقع باستخدام GPS."
                )
            ),
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );

    });

}


/* =========================================
   Open-Meteo
========================================= */

async function getWeather(
    latitude,
    longitude
) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=surface_pressure" +
        "&timezone=auto";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "تعذر الحصول على بيانات الطقس."
        );

    }


    const data =
        await response.json();


    return data.current;

}


/* =========================================
   قراءة بارومتر الجوال
========================================= */

function readBarometer() {

    return new Promise((resolve, reject) => {

        /*
        Generic Sensor API
        */

        if (!("Barometer" in window)) {

            reject(
                new Error(
                    "المتصفح أو الجهاز لا يوفر حساس Barometer للصفحة."
                )
            );

            return;
        }


        let barometer;


        try {

            barometer =
                new Barometer({
                    frequency: 5
                });


            pressureReadings = [];


            barometer.addEventListener(
                "reading",
                () => {

                    if (
                        typeof barometer.pressure ===
                        "number"
                    ) {

                        pressureReadings.push(
                            barometer.pressure
                        );

                    }

                }
            );


            barometer.addEventListener(
                "error",
                event => {

                    reject(
                        new Error(
                            "تعذر الوصول إلى حساس الضغط في الجوال."
                        )
                    );

                }
            );


            barometer.start();


            /*
            ننتظر عدة ثوانٍ
            */

            setTimeout(() => {

                barometer.stop();


                if (
                    pressureReadings.length === 0
                ) {

                    reject(
                        new Error(
                            "لم يتم الحصول على قراءة من البارومتر."
                        )
                    );

                    return;
                }


                /*
                حساب المتوسط
                */

                const average =
                    pressureReadings.reduce(
                        (sum, value) =>
                            sum + value,
                        0
                    ) /
                    pressureReadings.length;


                /*
                حساس Generic Sensor غالباً
                يعيد الضغط بوحدة Pascal
                نحوله إلى hPa
                */

                const pressureHpa =
                    average / 100;


                resolve(
                    pressureHpa
                );


            }, READING_TIME);


        }

        catch (e) {

            reject(
                new Error(
                    "لا يمكن تشغيل حساس الضغط في هذا الجهاز."
                )
            );

        }

    });

}


/* =========================================
   تحويل فرق الضغط إلى ارتفاع
========================================= */

function pressureToHeight(
    groundPressure,
    phonePressure
) {

    /*
    المعادلة البارومترية التقريبية:

    h =
    44330 ×
    [1 - (P / P0)^0.1903]

    P0 = ضغط الأرض
    P  = ضغط الجوال
    */


    const height =
        44330 *
        (
            1 -
            Math.pow(
                phonePressure /
                groundPressure,
                0.1903
            )
        );


    return height;

}


/* =========================================
   الحالة
========================================= */

function setStatus(text) {

    document.getElementById("status").innerHTML =
        text;

}


function showError(message) {

    document.getElementById("error").innerHTML =
        "❌ " + message;

    document.getElementById("status").innerHTML =
        "";

}

</script>

</body>
</html>
